[package]
name = "sift-desktop"
description = "Sift: lanzador y buscador semántico de escritorio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# El sufijo `_lib` evita que el nombre de la lib choque con el del binario en Windows.
# https://github.com/rust-lang/cargo/issues/8519
name = "sift_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
sift-core = { workspace = true }
sift-spaces = { workspace = true, features = ["specta"] }
sift-storage = { workspace = true }
sift-extract = { workspace = true }
sift-embeddings = { workspace = true }
ureq = { workspace = true }
sha2 = { workspace = true }
sift-indexer = { workspace = true }
sift-search = { workspace = true, features = ["specta"] }
tauri = { workspace = true }
tauri-plugin-autostart = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-dialog = { workspace = true }
base64 = { workspace = true }
png = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
window-vibrancy = { workspace = true }
tauri-specta = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
notify = "8"

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
