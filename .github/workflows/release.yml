name: Release

# Publicar una versión: al subir una etiqueta `v1.2.3` (o `v1.0.0-rc.5`) que coincide con la
# versión de `apps/desktop/src-tauri/tauri.conf.json`, compila Sift en Windows, baja PDFium
# con su hash fijado, firma la actualización y deja una Release en BORRADOR con:
#   - el instalador `Sift_<versión>_x64-setup.exe` y su firma `.sig`,
#   - el `latest.json` que lee el actualizador,
#   - `SHA256SUMS.txt` con la huella del instalador,
#   - las notas de `docs/publicacion/notas/v<versión>.md`.
# La Release se queda en borrador hasta que Darío Morales Riega la revisa y pulsa «Publish release».
#
# LISTO (2026-11-24): versión 1.0.0, clave pública en `tauri.updater.conf.json` y los secretos
# TAURI_SIGNING_PRIVATE_KEY y TAURI_SIGNING_PRIVATE_KEY_PASSWORD creados en GitHub. Solo falta
# hacer público el repo (con el repo privado no hay minutos de Actions; con el público, son
# gratis) y subir la etiqueta `v1.0.0` (pasos en docs/publicacion/pasos.md). Si falta algo, el
# primer paso para y dice qué, antes de compilar nada.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # crear la Release en borrador y subir sus archivos

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    name: Instalador de Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Antes de compilar: que esté todo lo necesario, para no gastar 20 minutos en fallar.
      - name: Comprobar que se puede publicar
        id: version
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $errors = @()
          $v = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:REF_TYPE -eq "tag" -and $env:REF_NAME -ne "v$v") {
            $errors += "La etiqueta es $($env:REF_NAME), pero la versión de tauri.conf.json es $v (tendría que ser v$v)."
          }
          if (-not $env:SIGNING_KEY) { $errors += "Falta el secreto TAURI_SIGNING_PRIVATE_KEY (docs/publicacion/pasos.md, paso 3)." }
          if (-not $env:SIGNING_PASSWORD) { $errors += "Falta el secreto TAURI_SIGNING_PRIVATE_KEY_PASSWORD (docs/publicacion/pasos.md, paso 3)." }
          $updater = Get-Content apps/desktop/src-tauri/tauri.updater.conf.json -Raw | ConvertFrom-Json
          if ($updater.plugins.updater.pubkey -like "PEGA_AQUI*") {
            $errors += "Falta la clave pública en apps/desktop/src-tauri/tauri.updater.conf.json (docs/publicacion/pasos.md, paso 4)."
          }
          $notes = "docs/publicacion/notas/v$v.md"
          if (-not (Test-Path $notes)) { $errors += "Faltan las notas de la versión: $notes." }
          if ($errors) {
            $errors | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }
          # Una versión con guion (`1.0.0-rc.1`) es una versión candidata: sale como
          # «pre-release» y el actualizador de las versiones estables no la ve.
          "version=$v" >> $env:GITHUB_OUTPUT
          "prerelease=$($v.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "notes=$notes" >> $env:GITHUB_OUTPUT

      - name: Instalar toolchain fijada
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      # pdfium.dll (versión y SHA-256 fijados en el script) va dentro del instalador. Si la
      # huella no coincide, el script para y no se usa el archivo.
      - name: Descargar PDFium
        shell: pwsh
        run: ./scripts/fetch-pdfium.ps1
      - name: Dependencias de la interfaz
        working-directory: apps/desktop
        run: npm ci

      # tauri-action compila, firma el `latest.json` con la clave de los secretos y crea la
      # Release en borrador con el instalador y el `latest.json`.
      - uses: tauri-apps/tauri-action@v0
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          # La configuración del actualizador (clave pública, dirección del `latest.json`,
          # artefactos firmados) solo se añade aquí: la compilación de todos los días no la
          # lleva y no necesita la clave.
          args: --config src-tauri/tauri.updater.conf.json
          tagName: v__VERSION__
          releaseName: Sift __VERSION__
          releaseBody: "Notas en camino."
          releaseDraft: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          includeUpdaterJson: true

      # Las notas, desde su archivo (en Markdown, con varias líneas), y la huella del
      # instalador para quien quiera comprobar la descarga.
      - name: Notas y huella del instalador
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          $setup = Get-ChildItem target/release/bundle/nsis -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "no se encontró el instalador en target/release/bundle/nsis" }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($setup.Name)" | Set-Content -Encoding ascii SHA256SUMS.txt
          gh release upload $tag SHA256SUMS.txt --clobber
          gh release edit $tag --notes-file "${{ steps.version.outputs.notes }}"
