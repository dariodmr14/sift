name: CI

# Solo a mano (pestaña Actions → CI → «Run workflow», o `gh workflow run ci.yml --ref <rama>`):
# los minutos gratis de Actions se agotaron y el presupuesto es 0 $. La CI de cada PR se
# ejecuta en local con `scripts/ci.ps1`, que hace lo mismo que este archivo.
#
# Para reactivarla en cada push a main y en cada PR, cambia el bloque `on:` por:
#
#   on:
#     push:
#       branches: [main]
#     pull_request:
#     workflow_dispatch:
on:
  workflow_dispatch:

# Si llega un push nuevo a la misma rama, cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # La CI no necesita info de depuración incremental: compila más rápido y la caché pesa menos.
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # No hace falta instalar Rust a mano: rustup ya viene en el runner y lee rust-toolchain.toml.
      - name: Instalar toolchain fijada
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Formato
        run: cargo fmt --all --check
      # pdfium.dll (versión y SHA-256 fijados): con ella se ejecutan los tests de PDF.
      - name: Descargar PDFium
        shell: pwsh
        run: ./scripts/fetch-pdfium.ps1
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  frontend:
    name: Frontend (prettier, eslint, tsc, vitest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build de la app
    needs: [rust, frontend]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Instalar toolchain fijada
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # La DLL viaja con la app como recurso (ADR 0008).
      - name: Descargar PDFium
        shell: pwsh
        working-directory: .
        run: ./scripts/fetch-pdfium.ps1
      # --no-bundle: compila la app en release sin generar el instalador (eso llega en la Fase 8).
      - run: npm run tauri build -- --no-bundle
