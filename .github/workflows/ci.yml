name: CI

on:
  push:
    branches: [main]
  pull_request:

# Si llega un push nuevo a la misma rama, cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # La CI no necesita info de depuración incremental: compila más rápido y la caché pesa menos.
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # No hace falta instalar Rust a mano: rustup ya viene en el runner y lee rust-toolchain.toml.
      - name: Instalar toolchain fijada
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Formato
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  frontend:
    name: Frontend (prettier, eslint, tsc, vitest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build de la app
    needs: [rust, frontend]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Instalar toolchain fijada
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # --no-bundle: compila la app en release sin generar el instalador (eso llega en la Fase 8).
      - run: npm run tauri build -- --no-bundle
