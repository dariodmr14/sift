[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri", "crates/*"]

# Metadatos comunes: cada crate los hereda con `xxx.workspace = true`.
[workspace.package]
version = "1.0.0-rc.2"
edition = "2024"
rust-version = "1.99"
# Todos los derechos reservados (ver LICENSE). `LicenseRef-` es la forma SPDX de
# nombrar una licencia que no está en su lista.
license = "LicenseRef-AllRightsReserved"
repository = "https://github.com/dariodmr14/Sift"
authors = ["Darío"]

# Versiones de dependencias en un solo sitio. Los crates las usan con `dep.workspace = true`.
[workspace.dependencies]
sift-core = { path = "crates/core" }
sift-storage = { path = "crates/storage" }
sift-extract = { path = "crates/extract" }
sift-indexer = { path = "crates/indexer" }
sift-embeddings = { path = "crates/embeddings" }
sift-search = { path = "crates/search" }
sift-spaces = { path = "crates/spaces" }

tauri = { version = "2.12", features = ["tray-icon"] }
tauri-build = "2.7"
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
rusqlite = { version = "0.41", features = ["bundled"] }
base64 = "0.23"
png = "0.18"
encoding_rs = "0.8"
blake3 = "1"
walkdir = "2"
globset = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
# Sin el renderizado a imagen: solo se extrae texto.
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_latest", "thread_safe"] }
# Embeddings (ADR 0009): ONNX Runtime baja su librería al compilar; el tokenizador sin
# barras de progreso ni descargas.
ort = "=2.0.0-rc.15"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
usearch = "2.26"
half = "2"
# Descarga del modelo (la única conexión de la app) y su comprobación.
ureq = "3"
sha2 = "0.10"
tantivy = "0.27"
tauri-plugin-dialog = "2.8"
tauri-plugin-updater = "2"
anyhow = "1"
tracing = "0.1"
# Benchmarks (solo desarrollo), sin gráficas.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support", "rayon"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
window-vibrancy = "0.8"
windows-sys = "0.61"
windows = "0.62"

# IPC tipado. tauri-specta para Tauri 2 sigue en RC y exige versiones exactas de specta:
# se fijan con "=" para que un `cargo update` no las mueva sin querer (ver ADR 0003).
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"

# Lints comunes. Con `cargo clippy -- -D warnings` en la CI, un "warn" rompe el build.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn" # CLAUDE.md: nada de unwrap() fuera de tests (ver clippy.toml)
dbg_macro = "warn"
todo = "warn"

# Los perfiles solo cuentan en la raíz del workspace.
# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# `unwind` y no `abort`: un fallo inesperado al leer un archivo raro se puede atrapar y
# apuntar el archivo como dañado. Con `abort` cerraba Sift entero y, al volver a leerlo al
# arrancar, se cerraba otra vez (auditoría, A1).
panic = "unwind"
strip = true
